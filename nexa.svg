<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 80" width="250" height="80">
  <!-- Custom Brand Logo "nexa" with Arrow Icon -->
  <g>
    <!-- Letters "ne" using system bold sans-serif -->
    <text x="15" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="56" fill="#2563EB" letter-spacing="-2">ne</text>
    
    <!-- Custom "x" with Arrow (positioned between "ne" and "a") -->
    <!-- Left-to-right diagonal: \ -->
    <line x1="82" y1="26" x2="110" y2="60" stroke="#2563EB" stroke-width="9.5" stroke-linecap="round" />
    <!-- Bottom-left to top-right extended arrow: / -->
    <line x1="82" y1="60" x2="126.5" y2="7.5" stroke="#2563EB" stroke-width="9.5" stroke-linecap="round" />
    <!-- Sharp Arrowhead at (126.5, 7.5) pointing up-right at 45 degrees -->
    <polygon points="111.5,7.5 128,6 126.5,22.5" fill="#2563EB" />
    
    <!-- Letter "a" -->
    <text x="136" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="56" fill="#2563EB" letter-spacing="-2">a</text>
  </g>
</svg>
